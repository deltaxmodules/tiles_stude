<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cognitive Streaming — Research Interface</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="container">

      <header class="page-header">
        <h1>Cognitive Streaming</h1>
        <p class="subtitle">Research interface &mdash; streaming cognition with execution trace</p>
      </header>

      <section class="chat" aria-label="Research chat">
        <div class="trace" id="tracePanel" aria-live="polite">
          <div class="trace-title">Execution Trace</div>
          <ul id="traceList" class="trace-list"></ul>
        </div>
        <div class="chat-log" id="chatLog"></div>
        <form class="chat-form" id="chatForm">
          <textarea id="prompt" placeholder="Enter your research question…" required></textarea>
          <button type="submit" id="sendBtn">Send</button>
        </form>
      </section>

      <p class="hint">
        Requests are sent to <code>/v1/chat/completions</code> with <code>stream=false</code>.
      </p>

    </div>
    <script src="/static/app.js"></script>
  </body>
</html>
